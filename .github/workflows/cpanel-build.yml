# بناء حزمة cPanel الجاهزة للتشغيل على Linux (نفس نظام السيرفر) عند الحاجة، بدل البناء على جهاز المطوّر.
# يُشغَّل يدوياً من تبويب Actions → "cPanel build artifact" → Run workflow.
#
# المطلوب قبل التشغيل: Settings → Secrets and variables → Actions → أضف الأسرار التالية بقيم الإنتاج
# (نفس أسماء .env.example): NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, NEXT_PUBLIC_VAPID_PUBLIC_KEY,
# SUPABASE_SERVICE_ROLE_KEY, VAPID_PRIVATE_KEY, VAPID_EMAIL, CRON_SECRET, ULTRAMSG_INSTANCE_ID, ULTRAMSG_TOKEN.
# الدومين لا يُدمج في الحزمة: يُضبط على السيرفر وقت التشغيل عبر SITE_URL في .env.production.
#
# الناتج: أرشيف dist-cpanel (الخادم + node_modules اللازمة + .next + public) بدون .env.production؛
# أضِفه على السيرفر في جذر التطبيق. انظر DEPLOY_CPANEL.md (الطريقة أ).
name: cPanel build artifact

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_ENV: production
      NEXT_OUTPUT_STANDALONE: "1"
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_VAPID_PUBLIC_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
      VAPID_EMAIL: ${{ secrets.VAPID_EMAIL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      ULTRAMSG_INSTANCE_ID: ${{ secrets.ULTRAMSG_INSTANCE_ID }}
      ULTRAMSG_TOKEN: ${{ secrets.ULTRAMSG_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install (devDependencies are required by next build)
        run: npm ci --include=dev

      - name: Build (standalone)
        run: npm run build 2>&1 | tee build.log

      - name: Verify build output
        run: |
          test -f public/sw.js
          grep -c -F -e "$(cat .next/BUILD_ID)" public/sw.js
          grep -rl "serviceWorker.register" .next/static/chunks | head -1
          grep -c "Bundling the service worker" build.log
          test -f .next/standalone/server.js

      - name: Assemble dist-cpanel
        run: |
          node scripts/package-cpanel.mjs
          test -f dist-cpanel/server.js && test -f dist-cpanel/next-standalone.js && test -f dist-cpanel/public/sw.js
          tar -czf cpanel-ready-${GITHUB_SHA::7}.tar.gz -C dist-cpanel .
          ls -la cpanel-ready-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: cpanel-ready-${{ github.sha }}
          path: cpanel-ready-*.tar.gz
          retention-days: 14
